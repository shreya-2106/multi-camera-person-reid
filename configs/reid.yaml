# Re-Identification defaults, kept separate for callers that merge this file.
# Phase 6 uses pretrained OSNet inference only. Fine-tuning is a future phase.

reid:
  enabled: true
  model: "osnet"
  device: "auto"
  image_width: 128
  image_height: 256
  batch_size: 16
  normalize_embeddings: true
  output_dir: "outputs/embeddings"

matching:
  similarity_metric: "cosine"   # cosine | euclidean
  similarity_threshold: 0.6
  index_type: "faiss_flat"      # implemented in Phase 3

data:
  gallery_dir: "data/reid/gallery"
  query_dir: "data/reid/query"
