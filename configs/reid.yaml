# Re-Identification defaults, kept separate for callers that merge this file.
# Phase 6 uses pretrained OSNet inference only. Fine-tuning is a future phase.

reid:
  enabled: true
  model: "osnet"
  device: "auto"
  image_width: 128
  image_height: 256
  batch_size: 16
  normalize_embeddings: true
  output_dir: "outputs/embeddings"
  checkpoint: "models/osnet_market1501_epoch_3.pth"

  quality:
    enabled: true
    min_valid_crops: 3
    min_crop_width: 40
    min_crop_height: 80
    min_crop_area: 3200

matching:
  similarity_metric: "cosine"
  similarity_threshold: 0.6
  index_type: "faiss_flat"

data:
  gallery_dir: "data/reid/gallery"
  query_dir: "data/reid/query"
