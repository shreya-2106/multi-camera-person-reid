# Camera topology configuration
# Phase 9: camera connectivity and temporal constraints

topology:
  enabled: true

  cameras:
    CAM01:
      outgoing:
        - CAM02
        - CAM03

    CAM02:
      outgoing:
        - CAM04

    CAM03:
      outgoing:
        - CAM04

    CAM04:
      outgoing: []

  transitions:
    CAM01_to_CAM02:
      from_camera: "CAM01"
      to_camera: "CAM02"
      min_travel_time_seconds: 2.0
      max_travel_time_seconds: 30.0

    CAM01_to_CAM03:
      from_camera: "CAM01"
      to_camera: "CAM03"
      min_travel_time_seconds: 2.0
      max_travel_time_seconds: 30.0

    CAM02_to_CAM04:
      from_camera: "CAM02"
      to_camera: "CAM04"
      min_travel_time_seconds: 2.0
      max_travel_time_seconds: 30.0

    CAM03_to_CAM04:
      from_camera: "CAM03"
      to_camera: "CAM04"
      min_travel_time_seconds: 2.0
      max_travel_time_seconds: 30.0