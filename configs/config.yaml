# Main application configuration
# Multi-Camera Person Re-Identification & Tracking System

app:
  name: "multi-camera-reid-tracking"
  version: "0.1.0"
  env: "development"

paths:
  data_dir: "data"
  videos_dir: "data/videos"
  reid_data_dir: "data/reid"
  models_dir: "models"
  logs_dir: "logs"
  output_dir: "output"
  reports_dir: "outputs"

logging:
  level: "INFO"
  log_to_file: true
  log_file: "app.log"
  max_bytes: 5242880
  backup_count: 3

device:
  prefer_cuda: true

detection:
  enabled: true
  model: "models/yolov8n.pt"
  confidence: 0.5
  iou: 0.45
  imgsz: 640
  device: "auto"
  classes:
    - "person"
  output_dir: "outputs/detections"
  annotated_output_dir: "outputs/annotated"

tracking:
  enabled: false
  tracker: "bytetrack"

reid:
  enabled: false
  config_file: "configs/reid.yaml"

matching:
  enabled: false
  index: "faiss"

dashboard:
  enabled: false
  host: "0.0.0.0"
  port: 8050
