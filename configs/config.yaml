# Main application configuration
# Multi-Camera Person Re-Identification & Tracking System

app:
  name: "multi-camera-reid-tracking"
  version: "0.1.0"
  env: "development"

paths:
  data_dir: "data"
  videos_dir: "data/videos"
  reid_data_dir: "data/reid"
  models_dir: "models"
  logs_dir: "logs"
  output_dir: "output"
  reports_dir: "outputs"

logging:
  level: "INFO"
  log_to_file: true
  log_file: "app.log"
  max_bytes: 5242880
  backup_count: 3

device:
  prefer_cuda: true

detection:
  enabled: true
  model: "models/yolov8n.pt"
  confidence: 0.5
  iou: 0.45
  imgsz: 640
  # Process a small frame batch per YOLO call; ByteTrack still updates every frame.
  inference_batch_size: 8
  device: "auto"
  classes:
    - "person"
  output_dir: "outputs/detections"
  annotated_output_dir: "outputs/annotated"

tracking:
  # Phase 4: ByteTrack assigns IDs only within one camera/video stream.
  enabled: true
  tracker: "bytetrack"
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  track_buffer: 30
  match_thresh: 0.8
  fuse_score: true
  output_dir: "outputs/tracking"
  annotated_output_dir: "outputs/tracking_annotated"

crops:
  # Phase 5: prepare high-quality local-track crops for future Re-ID only.
  enabled: true
  output_dir: "outputs/crops"
  min_width: 20
  min_height: 40
  min_area: 800
  padding: 0.05
  save_every_n_frames: 5

reid:
  # Phase 6: OSNet inference produces appearance embeddings only; it does not assign identities.
  enabled: true
  model: "osnet"
  device: "auto"
  image_width: 128
  image_height: 256
  batch_size: 16
  normalize_embeddings: true
  output_dir: "outputs/embeddings"




matching:
  enabled: false
  index: "faiss"

dashboard:
  enabled: false
  host: "0.0.0.0"
  port: 8050
topology:
  enabled: true

  cameras:
    CAM01:
      outgoing:
        - CAM02
        - CAM03

    CAM02:
      outgoing:
        - CAM04

    CAM03:
      outgoing:
        - CAM04

    CAM04:
      outgoing: []

  transitions:
    CAM01_to_CAM02:
      from_camera: "CAM01"
      to_camera: "CAM02"
      min_travel_time_seconds: 2.0
      max_travel_time_seconds: 30.0

    CAM01_to_CAM03:
      from_camera: "CAM01"
      to_camera: "CAM03"
      min_travel_time_seconds: 2.0
      max_travel_time_seconds: 30.0

    CAM02_to_CAM04:
      from_camera: "CAM02"
      to_camera: "CAM04"
      min_travel_time_seconds: 2.0
      max_travel_time_seconds: 30.0

    CAM03_to_CAM04:
      from_camera: "CAM03"
      to_camera: "CAM04"
      min_travel_time_seconds: 2.0
      max_travel_time_seconds: 30.0
