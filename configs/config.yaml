# Main application configuration
# Multi-Camera Person Re-Identification & Tracking System
# Phase 1: only generic app/paths/logging/device settings are meaningful.
# Sections for detection/tracking/reid/matching are placeholders for later phases.

app:
  name: "multi-camera-reid-tracking"
  version: "0.1.0"
  env: "development"   # development | production | test

paths:
  data_dir: "data"
  videos_dir: "data/videos"
  reid_data_dir: "data/reid"
  models_dir: "models"
  logs_dir: "logs"
  output_dir: "output"

logging:
  level: "INFO"          # DEBUG | INFO | WARNING | ERROR | CRITICAL
  log_to_file: true
  log_file: "app.log"
  max_bytes: 5242880      # 5 MB
  backup_count: 3

device:
  prefer_cuda: true       # use CUDA if available, else fall back to CPU

# --- Placeholders for future phases (not implemented yet) ---
detection:
  enabled: false
  model: "yolo"           # implemented in Phase 2
  weights_path: "models/yolo/yolov8n.pt"
  confidence_threshold: 0.5

tracking:
  enabled: false
  tracker: "bytetrack"    # implemented in Phase 2

reid:
  enabled: false
  config_file: "configs/reid.yaml"

matching:
  enabled: false
  index: "faiss"          # implemented in Phase 3

dashboard:
  enabled: false
  host: "0.0.0.0"
  port: 8050
